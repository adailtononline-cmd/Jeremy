name: Build Jeremy IPTV
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: pip install pillow
      - name: Build and validate playlist
        run: python build.py
      - name: Publish generated playlist and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeremy.m3u report.json reports logos
          if [ -f epg.xml ]; then git add epg.xml; fi
          git diff --cached --quiet || (git commit -m "Update Jeremy IPTV playlist" && git push)
